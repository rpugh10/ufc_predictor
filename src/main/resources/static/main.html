<!DOCTYPE html>
<html>
  <head>
    <title>Fight Predictor</title>
    <link rel="stylesheet" href="main.css">
  </head>

  <body>

    <form id="predictionForm">
      <div class="page">
        <div class="fight_box">
          <div class="fighters">
            <input type="text" id="fighterA" placeholder="Fighter 1">
            <div class="vs">VS</div>
            <input type="text" id="fighterB" placeholder="Fighter 2">
          </div>
          <button class="predict_btn" type="submit">Predict</button>
        </div>
      </div>
    </form>

    <div id="popup" class="popup hidden">
      <div class="popup-content">
        <p id="popupMessage"></p>
        <button id="popupBtn">OK</button>
      </div>
    </div>

    <script src="main.js" defer></script>
  </body>
</html>
